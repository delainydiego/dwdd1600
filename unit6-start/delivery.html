<!doctype html>
<html lang="en">

<head>
    <meta name="description" content="Get your next meal delivered by drone.">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:wght@200;500&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="delivery.css">

    <meta charset="UTF-8">
    <title>Drone Delivery Services LLC.</title>
</head>

<body>
    <!-- start the page header -->
    <header>
        <span>Drone Delivery </span>
    </header>

    <!-- start the page navigation -->
    <nav>
        <ul>
            <li><a href="index.html">About Us</a></li>
            <li class="active"><a href="delivery.html">Request a Delivery</a></li>
            <li><a href="#">Contact Us</a></li>
        </ul>
    </nav>

    <!-- start the page main -->
    <main>
        <h1>Request A Delivery</h1>
        <form method="get" class="myForm" action="thanks.html">

        <fieldset>
        <legend>Customer Information</legend>
            <label>First Name*<input type="text" name="firstName" required></label>
            <label>Last Name*<input type="text" name="lastName" required></label>
            <label>Phone Number*<input type="tel" name="phone" required placeholder="123-456-7890"></label>
        </fieldset>

        <fieldset>
        <legend>Delivery Method</legend>
            <label><input type="radio" name="method" value="parachute" required> Parachute Delivery (4 hours)</label>
            <label><input type="radio" name="method" value="vacuum"> RoboVacuum Delivery (18 hours)</label>
            <label><input type="radio" name="method" value="spongebob"> SpongeBob and Squidward Delivery (2 weeks)</label>
        
        </fieldset>
        
        <fieldset>
        <legend>Delivery Options</legend>
            <label><input type="checkbox" name="porch" value="chosen"> Front Porch Delivery</label>
            <label><input type="checkbox" name="deck" value="chosen"> Back Deck Delivery</label>
            <label><input type="checkbox" name="driveway" value="chosen"> Driveway Delivery</label>
            <label><input type="checkbox" name="yard" value="chosen"> Yard Delivery</label>

            <label>Preferred Delivery Time*
            <select name="time">
                <option value="none">Select a Delivery Time</option>
                <option value="morning">Morning (7am-11am)</option>
                <option value="midday">Midday (11am-2pm)</option>
                <option value="afternoon">Afternoon (2pm-5pm)</option>
                <option value="evening">Evening (5pm-8pm)</option>
            </select>
            </label>
        </fieldset>

        <label>Additional Comments
            <textarea name="comments">Please add any additional comments here...</textarea>
        </label>


        <input type="submit" value="Send Delivery Request">
        </form>
    </main>

    <!-- start the page footer -->
    <footer>
        <p>&copy;202X &bull; Drone Delivery Services &bull; <a href="mailto:zen@gmail.com">Email Us</a> </p>
    </footer>
</body>

</html>
